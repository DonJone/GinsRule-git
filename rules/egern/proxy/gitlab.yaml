# Gins-Rules: gitlab
rules:
- domain_suffix:
    match: gitlab.com
    policy: Proxy
- domain_suffix:
    match: gitlab.io
    policy: Proxy
- domain_suffix:
    match: gitlab.net
    policy: Proxy
- domain_suffix:
    match: gitter-static.net
    policy: Proxy
- domain_suffix:
    match: gitter.im
    policy: Proxy
- domain_keyword:
    match: gitlab
    policy: Proxy
